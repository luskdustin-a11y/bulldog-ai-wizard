name: Build ARCHER Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archer_*.py'
      - 'bulldawg_core.py'
      - 'tests/**'
      - '.github/workflows/build-archer-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unit and simulation tests
        run: python -m unittest discover -s tests -v
      - name: Run simulated installation checks
        run: python archer_windows_launcher.py --preflight
      - name: Run eight-department simulator
        run: python archer_windows_launcher.py --simulate
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build ARCHER executable
        run: python -m PyInstaller --clean --onefile --windowed --name ARCHER archer_windows_launcher.py
      - name: Verify executable and SHA256
        shell: pwsh
        run: |
          if (!(Test-Path dist/ARCHER.exe)) { throw 'ARCHER.exe missing' }
          Get-FileHash dist/ARCHER.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ARCHER-Windows-Desktop
          path: dist/ARCHER.exe
          retention-days: 7
