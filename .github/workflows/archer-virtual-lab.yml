name: ARCHER Free Virtual Windows Lab
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [archer-stage4-integration-hardening]
    paths:
      - 'archer_*.py'
      - 'tests/**'
      - '.github/workflows/archer-virtual-lab.yml'
permissions:
  contents: read
jobs:
  virtual-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install required cryptography library
        run: python -m pip install "cryptography>=43,<47"
      - name: Unit tests in clean Windows virtual machine
        run: python -m unittest discover -s tests -v
      - name: Verify complete local communications path
        run: python archer_comms_acceptance.py
      - name: Verify HTTP relay round trip
        run: python archer_relay_acceptance.py
      - name: Verify eight departments
        run: python archer_windows_launcher.py --simulate
      - name: Verify laptop compatibility preflight
        run: python archer_windows_launcher.py --preflight
      - name: Save Windows VM inventory
        shell: pwsh
        run: |
          python archer_hardware_inventory.py | Out-File -Encoding utf8 "archer-virtual-lab-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARCHER-VM-${{ matrix.os }}
          path: archer-virtual-lab-*.json
          if-no-files-found: ignore
