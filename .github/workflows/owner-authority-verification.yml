name: Owner Authority Regression
on:
  pull_request:
    paths: ['archer_owner_authority.py', 'tests/test_archer_owner_authority.py', '.github/workflows/owner-authority-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full core and regression suite
        run: python -m unittest discover -s tests -v
