name: Archie Security Gate
on:
  pull_request:
  push:
    branches: [main, fix/rg6-release-gate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Scan Python source for common vulnerabilities
        run: |
          python -m pip install 'bandit>=1.8,<2'
          bandit -r . -x ./tests -f json -o bandit-report.json --severity-level medium
      - name: Scan repository for known secrets
        if: always()
        run: |
          python -m pip install 'detect-secrets>=1.5,<2'
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git/|bandit-report\.json)' > secrets-report.json
          python -c "import json,sys; d=json.load(open('secrets-report.json')); sys.exit(bool(d.get('results')))"
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archie-Security-Reports
          path: |
            bandit-report.json
            secrets-report.json
          if-no-files-found: ignore
