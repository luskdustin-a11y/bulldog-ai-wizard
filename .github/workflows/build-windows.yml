name: Build Windows Wizard
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bulldog_install_wizard.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main, 'repair/archie-4.3-stabilization-2026-10-27']
    paths:
      - 'bulldog_install_wizard.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate syntax
        run: python -m py_compile bulldog_install_wizard.py
      - name: Run standard library smoke tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build executable
        run: python -m PyInstaller --clean --onefile --windowed --name BulldawgAI_InstallWizard bulldog_install_wizard.py
      - name: Smoke-launch packaged GUI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/BulldawgAI_InstallWizard.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Wizard exited unexpectedly with code $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Check executable and hash
        shell: pwsh
        run: |
          if (!(Test-Path dist/BulldawgAI_InstallWizard.exe)) { throw 'EXE missing' }
          Get-FileHash dist/BulldawgAI_InstallWizard.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: BulldawgAI-Windows-Wizard
          path: dist/BulldawgAI_InstallWizard.exe
          retention-days: 7
