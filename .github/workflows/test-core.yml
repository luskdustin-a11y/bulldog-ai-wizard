name: Test Offline Core
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'bulldawg_core.py'
      - 'archer_*.py'
      - 'tests/**'
      - '.github/workflows/test-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cryptography
        run: python -m pip install 'cryptography>=43,<47'
      - name: Compile
        run: python -m compileall -q bulldawg_core.py bulldog_install_wizard.py archer_*.py
      - name: Unit and stress tests
        run: python -m unittest discover -s tests -v
