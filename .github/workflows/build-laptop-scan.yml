name: Build Archie Laptop Scan
on:
  workflow_dispatch:
  push:
    paths:
      - 'archer_laptop_scan.py'
      - 'archer_install_preflight.py'
      - 'tests/test_archer_laptop_scan.py'
      - 'installer/laptop-scan.iss'
      - '.github/workflows/build-laptop-scan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: python -m unittest tests.test_archer_laptop_scan -v
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build
        run: python -m PyInstaller --clean --onefile --name ArchieLaptopScan archer_laptop_scan.py
      - name: Run it on this Windows machine (real scan)
        shell: pwsh
        run: |
          'x' | .\dist\ArchieLaptopScan.exe
          if ($LASTEXITCODE -ne 0) { throw 'Scan exe failed' }
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup missing' }
          & $compiler installer\laptop-scan.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Install, run, uninstall test
        shell: pwsh
        run: |
          $setup = 'installer\output\ArchieLaptopScan-Setup.exe'
          $dir = "$env:LOCALAPPDATA\Programs\ArchieLaptopScan"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed $($p.ExitCode)" }
          if (!(Test-Path "$dir\ArchieLaptopScan.exe")) { throw 'Not installed' }
          'x' | & "$dir\ArchieLaptopScan.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed scan failed' }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Reinstall failed' }
          $un = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          $p = Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          Start-Sleep 3
          if (Test-Path "$dir\ArchieLaptopScan.exe") { throw 'Files left after uninstall' }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer\output\ArchieLaptopScan-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  ArchieLaptopScan-Setup.exe" | Set-Content installer\output\ArchieLaptopScan-Setup.exe.sha256 -Encoding ascii
          "SHA256 $h" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Publish draft pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "laptop-scan-setup-${{ github.run_id }}" installer/output/ArchieLaptopScan-Setup.exe installer/output/ArchieLaptopScan-Setup.exe.sha256 --draft --prerelease --target ${{ github.sha }} --title "Archie Laptop Scan Setup ${{ github.run_id }}" --notes "Standalone read-only laptop scan installer. Separate from Archie. Not a main release."
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
