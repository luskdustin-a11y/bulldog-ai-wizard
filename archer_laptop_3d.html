<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archie | HP Laptop 3D</title><style>body{margin:0;background:#0b1220;color:#e2e8f0;font:16px system-ui}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);height:100vh}#view{touch-action:none;min-height:60vh}aside{padding:24px;background:#172033}button{padding:10px;margin:5px;background:#1e40af;color:white;border:0;border-radius:6px}small{color:#94a3b8}@media(max-width:750px){main{display:block}#view{height:60vh}}</style></head><body><main><div id="view" aria-label="Touch draggable 3D laptop"></div><aside><h2>ARCHIE — Laptop 3D</h2><p>HP Laptop 17-cp3155cl (reference model)</p><p>Drag one finger to rotate in any direction. Pinch to zoom. Use two fingers to pan.</p><button id="reset">Reset view</button><button id="lid">Open / close lid</button><p id="part">Tap a component to inspect it.</p><small>Illustrative proportions and components. No live hardware telemetry. Online connection required to load 3D engine.</small></aside></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';const host=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1220);const camera=new THREE.PerspectiveCamera(45,1,.01,100);camera.position.set(5,3.5,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=15;controls.maxPolarAngle=Math.PI;controls.minPolarAngle=0;controls.target.set(0,.25,0);scene.add(new THREE.HemisphereLight(0xffffff,0x344155,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);const laptop=new THREE.Group();scene.add(laptop);function box(name,w,h,d,color,x,y,z,parent=laptop){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.5}));m.position.set(x,y,z);m.name=name;parent.add(m);return m}box('Laptop base',3.8,.14,2.55,0x9ca3af,0,0,0);box('Keyboard',3.1,.015,1.15,0x222b39,0,.083,-.25);box('Trackpad',.85,.017,.55,0x6b7280,0,.084,.76);const lid=new THREE.Group();lid.position.set(0,.08,-1.25);laptop.add(lid);box('Display lid',3.8,2.3,.10,0x9ca3af,0,1.15,-.05,lid);box('Screen',3.55,2.02,.012,0x142d4b,0,1.15,.008,lid);lid.rotation.x=-.2;const parts=[['CPU',-.85,.11,-.6,0xf59e0b],['RAM',.45,.11,-.55,0x38bdf8],['SSD',1,.11,.4,0x38bdf8],['Cooling',-1.35,.11,.4,0x38bdf8]];parts.forEach(([name,x,y,z,color])=>box(name,.38,.035,.35,color,x,y,z));const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(laptop.children,true)[0];if(hit)document.getElementById('part').textContent='Selected: '+hit.object.name+' — illustrative model, diagnostic data not connected.'});document.getElementById('reset').onclick=()=>{camera.position.set(5,3.5,5);controls.target.set(0,.25,0);controls.update()};document.getElementById('lid').onclick=()=>{lid.rotation.x=lid.rotation.x<-.5?-.2:-1.1};function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();frame();</script></body></html>
